name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The specs themselves need the web app from its own repository and a test
  # user, so for now CI only checks the code of the suite
  static:
    name: Types, lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
