name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The suite tests the web app, which changes in its own repository and not
  # in this one: run it by hand after a change in the app
  workflow_dispatch:

jobs:
  static:
    name: Types, lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  e2e:
    name: E2E tests against the web app
    needs: static
    runs-on: ubuntu-latest
    # The logout spec revokes every session of the test user, so two runs at
    # the same time would break each other
    concurrency:
      group: e2e-test-user
      cancel-in-progress: false
    env:
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      # Read by the web app, which Playwright starts with "npm run dev"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    defaults:
      run:
        working-directory: Bitacora360-Automation-testing
    outputs:
      report-uploaded: ${{ steps.upload.outcome == 'success' }}
    steps:
      # Sibling folders, because the suite looks for the app in ../Bitacora360WebProyect
      - uses: actions/checkout@v4
        with:
          path: Bitacora360-Automation-testing
      - uses: actions/checkout@v4
        with:
          repository: FredySan25/Bitacora360WebProyect
          path: Bitacora360WebProyect
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            Bitacora360-Automation-testing/package-lock.json
            Bitacora360WebProyect/package-lock.json
      - run: npm ci
        working-directory: Bitacora360WebProyect
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # Allure draws the trend between runs from this file, which every run
      # publishes next to the report. The first run finds nothing to bring back
      - name: Bring back the history of the published report
        if: ${{ !cancelled() }}
        run: >
          curl -fsSL --retry 3 -o allure-history.jsonl
          https://fredysan25.github.io/Bitacora360-Automation-testing/allure-history.jsonl
          || rm -f allure-history.jsonl
      # The site has the Allure report at the root and the Playwright one,
      # which has more detail to debug a failure, under /playwright
      - name: Build the site
        if: ${{ !cancelled() }}
        run: |
          npx allure generate allure-results
          mkdir site
          cp -r allure-report/. site
          cp -r playwright-report site/playwright
          cp allure-history.jsonl site
      # The site is public, so it is only published after checking that the
      # reporter in support/ redacted the password. The Playwright report
      # embeds its data as a zip, which a plain grep cannot read
      - name: Check that the site does not contain the password
        id: check
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          grep -o 'data:application/zip;base64,[A-Za-z0-9+/=]*' site/playwright/index.html \
            | cut -d, -f2 | base64 -d > "$RUNNER_TEMP/report.zip"
          unzip -q "$RUNNER_TEMP/report.zip" -d "$RUNNER_TEMP/report"
          if grep -rqF -- "$E2E_USER_PASSWORD" "$RUNNER_TEMP/report" site; then
            echo "::error::The site contains the password of the test user"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        id: upload
        if: ${{ !cancelled() && steps.check.outcome == 'success' && github.ref == 'refs/heads/main' }}
        with:
          path: Bitacora360-Automation-testing/site/

  report:
    name: Publish the report to GitHub Pages
    needs: e2e
    # Also after a failed run: that is when the report is most useful
    if: ${{ !cancelled() && needs.e2e.outputs.report-uploaded == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
